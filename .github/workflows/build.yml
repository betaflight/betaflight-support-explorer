name: 'Build'

on:
  workflow_call:
    inputs:
      commit_ref:
        description: 'The git SHA to checkout'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    # Runs untrusted PR code on pull_request_target; keep the token read-only.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_ref }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Install node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build with Cloudflare adapter
        env:
          ADAPTER: cloudflare
        run: npm run build

      # wrangler bundles _worker.js (and its npm deps) at deploy time,
      # so ship the .svelte-kit tree plus the lockfile for a fresh install.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: |
            .svelte-kit
            package.json
            package-lock.json
          include-hidden-files: true
